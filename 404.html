<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه پیدا نشد | صابر خاک‌بیز</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a1128" />
    <link rel="icon" type="image/png" href="/Gilan-Electrical-Testing/images/favicon.png" />
    <style>
/* GitHub Pages serves this page for any missing address under the site, so
   every link and asset uses an absolute path. If the site moves to its own
   domain, remove the /Gilan-Electrical-Testing prefix. */
@font-face {
    font-family: "Vazirmatn";
    src: url("/Gilan-Electrical-Testing/fonts/Vazirmatn-Variable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
}
:root { --bg: #0a1128; --surface: #101f42; --line: #1c2d5a; --ink: #f8fafc; --muted: #9aa8c4; --accent: #f59e0b; color-scheme: dark; }
* { box-sizing: border-box; }
body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font-family: "Vazirmatn", Tahoma, sans-serif; line-height: 1.8;
    background-image: radial-gradient(rgba(154, 168, 196, .14) 1px, transparent 1.4px); background-size: 22px 22px;
    padding: 24px max(16px, env(safe-area-inset-left, 0px));
}
main { max-width: 560px; display: grid; gap: 14px; text-align: center; }
.code { font-size: 15px; font-weight: 800; color: var(--accent); letter-spacing: .1em; }
h1 { margin: 0; font-size: clamp(26px, 6vw, 36px); font-weight: 900; line-height: 1.4; }
p { margin: 0; color: var(--muted); }
nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 6px; }
a { text-decoration: none; font-weight: 700; font-size: 15px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 16px; }
a:hover, a:focus-visible { border-color: var(--accent); outline: none; }
a.main { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    </style>
</head>
<body>
    <main>
        <span class="code" dir="ltr">404</span>
        <h1>این صفحه پیدا نشد</h1>
        <p>شاید آدرس اشتباه تایپ شده یا صفحه جابه‌جا شده است. از یکی از این‌ها شروع کن:</p>
        <nav>
            <a class="main" href="/Gilan-Electrical-Testing/">صفحه‌ی اصلی</a>
            <a href="/Gilan-Electrical-Testing/regs/">مقررات برق</a>
            <a href="/Gilan-Electrical-Testing/products/">محصولات</a>
            <a href="/Gilan-Electrical-Testing/#standards">چک‌لیست‌ها</a>
            <a href="/Gilan-Electrical-Testing/#contact">ارتباط با من</a>
        </nav>
    </main>
</body>
</html>
