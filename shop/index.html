<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>فروشگاه ابزار تست | صابر خاک‌بیز</title>
    <meta name="description" content="ابزارهای دست‌ساز و امتحان‌شده برای تست و تحویل تاسیسات برقی؛ سرخط‌یاب صوتی، پراب مغناطیسی و ابزارهای کمکی. ثبت سفارش در تلگرام." />
    <meta name="theme-color" content="#0a1128" />
    <link rel="icon" type="image/png" href="../images/favicon.png" />
    <style>
/* Shop section of the main site. Same navy/amber palette and self-hosted
   Vazirmatn font as ../style.css; no external requests at all. */
@font-face {
    font-family: "Vazirmatn";
    src: url("../fonts/Vazirmatn-Variable.woff2") format("woff2 supports variations"),
         url("../fonts/Vazirmatn-Variable.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
}

:root {
    --bg: #0a1128;
    --surface: #101f42;
    --surface-2: #0d1834;
    --line: #1c2d5a;
    --ink: #f8fafc;
    --body: #d6deec;
    --muted: #9aa8c4;
    --accent: #f59e0b;
    --accent-glow: #fbbf24;
    --accent-ink: #0a1128;
    --ok: #6ee7b7;
    --warn: #fca5a5;
    --pole: #f87171;
    --f-body: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
    --r: 12px;
    --maxw: 1152px;
    color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--f-body); font-size: 16px; line-height: 1.85;
    -webkit-font-smoothing: antialiased;
}
body.no-scroll { overflow: hidden; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
img { max-width: 100%; }
button { font: inherit; }
[hidden] { display: none !important; }

.wrap {
    max-width: var(--maxw); margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.ico { width: 18px; height: 18px; flex: none; }

/* ---------- header ---------- */
.topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(10, 17, 40, .9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px);
}
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.brand img { width: 44px; height: 44px; object-fit: contain; flex: none; }
.brand-txt { display: grid; min-width: 0; line-height: 1.5; }
.brand-name { font-weight: 800; font-size: 15px; }
.brand-sub { font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.tbtn {
    position: relative; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700;
    text-decoration: none; color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap;
}
.tbtn:hover { border-color: var(--accent); color: var(--ink); }
.tbtn-cart { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.tbtn-cart:hover { background: var(--accent-glow); color: var(--accent-ink); }
.badge {
    position: absolute; top: -8px; left: -8px; min-width: 22px; height: 22px; padding: 0 6px;
    display: grid; place-items: center; border-radius: 999px; font-size: 12px; font-weight: 800;
    background: var(--ink); color: var(--accent-ink); border: 2px solid var(--bg);
}
@media (max-width: 560px) { .tbtn-back .tbtn-label { display: none; } }

/* ---------- hero ---------- */
main.wrap { padding-block: 32px 64px; display: grid; gap: 32px; }
.hero { display: grid; gap: 12px; max-width: 760px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .03em; color: var(--accent); }
.hero h1 { font-weight: 900; font-size: clamp(28px, 5vw, 46px); line-height: 1.4; }
.hero p { color: var(--muted); font-size: 17px; max-width: 62ch; }

.steps-wrap { display: grid; gap: 10px; }
.steps-title { font-size: 13px; font-weight: 700; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.steps li {
    display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 15px;
    background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px;
}
.step-n {
    flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%;
    border: 2px solid var(--accent); color: var(--accent); font-weight: 900; font-size: 14px; line-height: 1;
}
@media (max-width: 720px) { .steps { grid-template-columns: minmax(0, 1fr); } }

/* ---------- product grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; align-items: start; }
.product {
    display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    overflow: hidden; min-width: 0; transition: border-color .15s ease, transform .15s ease;
}
.product:hover { border-color: rgba(245, 158, 11, .55); transform: translateY(-2px); }
.media-link { display: block; text-decoration: none; }
.media {
    position: relative; aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center;
    background-color: var(--surface-2);
    background-image: radial-gradient(rgba(154, 168, 196, .18) 1px, transparent 1.4px);
    background-size: 18px 18px; border-bottom: 1px solid var(--line); overflow: hidden;
}
.media img { width: 100%; height: 100%; object-fit: cover; }
.art { width: 74%; height: auto; color: var(--accent); fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.art .fill { fill: currentColor; }
.art .thick { stroke-width: 6; }
.art .soft { stroke: var(--muted); stroke-width: 3; }
.art .magnet { stroke-width: 18; stroke-linecap: butt; }
.art .pole { stroke: var(--pole); stroke-width: 18; stroke-linecap: butt; }
.photo-soon {
    position: absolute; bottom: 10px; left: 12px; font-size: 11px; font-weight: 600; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 0 10px; background: rgba(10, 17, 40, .7);
}
.status {
    position: absolute; top: 12px; right: 12px; font-size: 12px; font-weight: 800;
    border-radius: 999px; padding: 2px 10px; background: rgba(10, 17, 40, .8); border: 1px solid var(--line);
}
.status-available { color: var(--ok); border-color: rgba(110, 231, 183, .35); }
.status-made-to-order { color: var(--accent); border-color: rgba(245, 158, 11, .4); }
.status-soon { color: var(--muted); }

.p-body { display: grid; gap: 10px; padding: 16px 18px 18px; min-width: 0; }
.p-body h2 { font-size: 20px; font-weight: 800; line-height: 1.5; }
.p-body h2 a { text-decoration: none; }
.p-body h2 a:hover { color: var(--accent); }
.p-tag { color: var(--accent); font-weight: 600; font-size: 14px; }
.p-feat { margin: 0; padding-inline-start: 1.1em; display: grid; gap: 2px; color: var(--body); font-size: 14.5px; }
.p-feat li::marker { color: var(--accent); }
.p-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 12px; border-top: 1px dashed var(--line); margin-top: 4px; }
.price { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.price b { font-size: 19px; color: var(--ink); font-weight: 900; }
.price-ask { color: var(--ink); font-weight: 700; }
.btn-add {
    font-weight: 800; font-size: 14px; color: var(--accent-ink); background: var(--accent);
    border: 1px solid var(--accent); border-radius: 8px; padding: 8px 16px; cursor: pointer;
    box-shadow: 0 10px 22px -12px rgba(245, 158, 11, .6);
}
.btn-add:hover { background: var(--accent-glow); }
.btn-add.is-in { background: transparent; color: var(--accent); box-shadow: none; }
.btn-add:disabled { background: transparent; color: var(--muted); border-color: var(--line); cursor: not-allowed; box-shadow: none; }

.ask {
    display: grid; gap: 10px; align-content: start; padding: 22px 20px; border-radius: var(--r);
    border: 1px dashed var(--line); background: transparent;
}
.ask h2 { font-size: 18px; font-weight: 800; }
.ask p { color: var(--muted); font-size: 14.5px; }
.btn-ghost {
    justify-self: start; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; font-size: 14px;
    color: var(--accent); border: 1px solid rgba(245, 158, 11, .45); border-radius: 8px; padding: 7px 14px; margin-top: 4px;
}
.btn-ghost:hover { background: var(--accent); color: var(--accent-ink); }

/* ---------- product dialog ---------- */
dialog.pd {
    width: min(640px, calc(100vw - 24px)); max-height: min(88vh, 900px); padding: 0;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 16px;
    overflow: auto; overscroll-behavior: contain;
}
dialog.pd::backdrop { background: rgba(2, 6, 18, .72); }
.pd-close {
    position: sticky; top: 10px; float: left; margin: 10px 10px -46px 0; z-index: 2;
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(10, 17, 40, .85); color: var(--ink); font-size: 20px; line-height: 1; cursor: pointer;
}
.media-big { aspect-ratio: 16 / 10; }
.d-body { display: grid; gap: 12px; padding: 18px 22px 22px; }
.d-body h2 { font-size: 24px; font-weight: 900; line-height: 1.45; }
.d-body h3 { font-size: 14px; font-weight: 800; color: var(--muted); letter-spacing: .02em; margin-top: 6px; }
.d-body > p { color: var(--body); }
.d-summary { font-size: 16px; }
.d-buy { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-block: 10px; border-block: 1px dashed var(--line); }
.specs { margin: 0; display: grid; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.specs div { display: grid; grid-template-columns: minmax(96px, 30%) minmax(0, 1fr); }
.specs div + div { border-top: 1px solid var(--line); }
.specs dt { padding: 8px 12px; color: var(--muted); font-size: 14px; background: var(--surface-2); }
.specs dd { margin: 0; padding: 8px 12px; font-size: 14.5px; }
.safety { display: grid; gap: 2px; padding: 10px 14px; border-radius: 8px; background: rgba(248, 113, 113, .1); border: 1px solid rgba(248, 113, 113, .22); font-size: 14.5px; }
.safety-k { font-size: 12px; font-weight: 800; color: var(--warn); }
.linkbtn { justify-self: start; background: none; border: 0; padding: 0; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; }
.linkbtn:hover { color: var(--ink); }

/* ---------- cart drawer ---------- */
.cart { position: fixed; inset: 0; z-index: 40; }
.cart-shade { position: absolute; inset: 0; border: 0; background: rgba(2, 6, 18, .66); }
.cart-panel {
    position: absolute; top: 0; bottom: 0; left: 0; width: min(420px, 94vw);
    background: var(--bg); border-right: 1px solid var(--line);
    display: grid; grid-template-rows: auto minmax(0, 1fr);
    padding-top: env(safe-area-inset-top, 0px); padding-left: env(safe-area-inset-left, 0px);
}
.cart-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.cart-head h2 { font-size: 18px; font-weight: 800; }
.x-btn { background: none; border: 0; color: var(--muted); font-size: 24px; line-height: 1; cursor: pointer; padding: 4px 8px; }
.cart-scroll { overflow-y: auto; padding: 14px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; align-content: start; }
.cart-empty { color: var(--muted); padding-block: 12px; }
.line {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center;
    padding-bottom: 12px; border-bottom: 1px dashed var(--line);
}
.line-info { display: grid; gap: 0; min-width: 0; }
.line-name { font-weight: 800; text-decoration: none; }
.line-name:hover { color: var(--accent); }
.line .price b { font-size: 15px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { width: 34px; height: 34px; background: var(--surface); border: 0; color: var(--ink); font-size: 18px; cursor: pointer; }
.stepper button:hover { background: var(--line); }
.stepper output { min-width: 34px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.line-rm { grid-column: 1 / -1; justify-self: start; background: none; border: 0; padding: 0; font-size: 12.5px; color: var(--warn); cursor: pointer; }
.sum-row { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
.sum-row b { font-weight: 900; }
.sum-ask { color: var(--muted); font-size: 13.5px; }

.order { display: grid; gap: 10px; }
.order h3 { font-size: 15px; font-weight: 800; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 600; }
.field input, .field textarea {
    font: inherit; font-size: 15px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; width: 100%;
}
.field textarea { min-height: 72px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
.form-msg { color: var(--warn); font-size: 13px; }
.send {
    display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;
    font-weight: 900; font-size: 16px; color: var(--accent-ink); background: var(--accent);
    border-radius: 10px; padding: 12px 16px; box-shadow: 0 12px 26px -12px rgba(245, 158, 11, .65);
}
.send:hover { background: var(--accent-glow); }
.send .ico { width: 22px; height: 22px; }
.copy-order { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 9px 16px; font-weight: 700; cursor: pointer; }
.copy-order:hover { border-color: var(--accent); }
.hint { font-size: 13.5px; color: var(--ok); background: rgba(110, 231, 183, .08); border: 1px solid rgba(110, 231, 183, .2); border-radius: 8px; padding: 8px 12px; }
.alt { font-size: 12.5px; color: var(--muted); }
details.preview { border: 1px solid var(--line); border-radius: 8px; }
details.preview summary { cursor: pointer; padding: 6px 12px; font-size: 13px; color: var(--muted); }
details.preview pre {
    margin: 0; padding: 10px 12px; border-top: 1px solid var(--line); white-space: pre-wrap; word-break: break-word;
    font: inherit; font-size: 13.5px; color: var(--body); max-height: 220px; overflow: auto;
}

/* ---------- toast + footer ---------- */
.toast {
    position: fixed; z-index: 60; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-width: calc(100vw - 32px);
    background: var(--ink); color: var(--accent-ink); font-weight: 700; font-size: 14px;
    padding: 8px 16px; border-radius: 999px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
}
.foot { border-top: 1px solid var(--line); }
.foot .wrap { padding-block: 20px calc(28px + env(safe-area-inset-bottom, 0px)); font-size: 13px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { .product { transition: none; } .product:hover { transform: none; } }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="wrap">
            <a class="brand" href="#">
                <img src="../images/logo.png" alt="" width="44" height="44" onerror="this.hidden=true">
                <span class="brand-txt">
                    <span class="brand-name">صابر خاک‌بیز</span>
                    <span class="brand-sub" id="brandSub"></span>
                </span>
            </a>
            <div class="top-actions">
                <a class="tbtn tbtn-back" href="../index.html">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
                    <span class="tbtn-label" id="backText"></span>
                </a>
                <button type="button" class="tbtn tbtn-cart" id="cartBtn" aria-expanded="false" aria-controls="cart">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
                    <span id="cartText"></span>
                    <span class="badge" id="cartBadge" hidden></span>
                </button>
            </div>
        </div>
    </header>

    <main class="wrap">
        <section class="hero">
            <span class="eyebrow" id="heroEyebrow"></span>
            <h1 id="heroTitle"></h1>
            <p id="heroLead"></p>
        </section>

        <section class="steps-wrap" aria-labelledby="stepsTitle">
            <span class="steps-title" id="stepsTitle"></span>
            <ol class="steps" id="steps"></ol>
        </section>

        <section class="grid" id="grid"></section>
    </main>

    <footer class="foot">
        <div class="wrap"><p id="footText"></p></div>
    </footer>

    <dialog class="pd" id="productDialog" aria-labelledby="dialogTitle">
        <button type="button" class="pd-close" id="dialogClose" data-dialog-close>&times;</button>
        <div id="dialogBody"></div>
    </dialog>

    <div class="cart" id="cart" hidden>
        <button type="button" class="cart-shade" data-cart-close tabindex="-1" aria-hidden="true"></button>
        <section class="cart-panel" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
            <div class="cart-head">
                <h2 id="cartTitle"></h2>
                <button type="button" class="x-btn" id="cartClose" data-cart-close>&times;</button>
            </div>
            <div class="cart-scroll">
                <div id="cartList"></div>
                <div id="cartSum"></div>
                <form class="order" id="orderForm" novalidate onsubmit="return false">
                    <h3 id="formTitle"></h3>
                    <div class="field"><label for="f-name" id="l-name"></label><input id="f-name" name="name" autocomplete="name" required></div>
                    <div class="field"><label for="f-city" id="l-city"></label><input id="f-city" name="city" autocomplete="address-level2"></div>
                    <div class="field"><label for="f-phone" id="l-phone"></label><input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr"></div>
                    <div class="field"><label for="f-note" id="l-note"></label><textarea id="f-note" name="note"></textarea></div>
                    <p class="form-msg" id="formMsg" role="alert" hidden></p>
                    <a class="send" id="sendTg" href="#" target="_blank" rel="noopener">
                        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 4.5L2.9 11.7c-.9.4-.9 1.6.1 1.9l4.6 1.4 1.8 5.6c.3.8 1.3 1 1.9.4l2.6-2.5 4.8 3.5c.7.5 1.7.1 1.9-.7l3.2-15.2c.2-1-.8-1.9-1.8-1.6zM9.6 14.3l8.6-6.9-6.9 8.3-.3 3.1-1.4-4.5z" fill="currentColor"/></svg>
                        <span id="sendText"></span>
                    </a>
                    <p class="hint" id="sentHint" role="status" hidden></p>
                    <button type="button" class="copy-order" id="copyOrder"></button>
                    <details class="preview" id="previewBox">
                        <summary id="previewLabel"></summary>
                        <pre id="orderPreview"></pre>
                    </details>
                    <p class="alt" id="altContact"></p>
                </form>
            </div>
        </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="products.js"></script>
    <script src="app.js"></script>
</body>
</html>
