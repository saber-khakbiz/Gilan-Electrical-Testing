<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 447 306" width="447" height="306">
  <title>Insulation and earth resistance tester (illustration)</title>
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#36425b"/><stop offset="1" stop-color="#171f30"/></linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfeadf"/><stop offset="1" stop-color="#bfd3c0"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa3b2"/><stop offset=".5" stop-color="#e5e7eb"/><stop offset="1" stop-color="#8b94a3"/></linearGradient>
  </defs>
  <rect width="447" height="306" fill="#ffffff"/>
  <ellipse cx="160" cy="276" rx="120" ry="10" fill="#0a1128" opacity=".12"/>
  <!-- handle -->
  <path d="M95 92 C 95 52, 225 52, 225 92" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <!-- case -->
  <rect x="48" y="88" width="224" height="180" rx="16" fill="url(#case)" stroke="#0f1626" stroke-width="2"/>
  <rect x="62" y="102" width="122" height="62" rx="7" fill="url(#lcd)" stroke="#0f1626" stroke-width="2"/>
  <text x="70" y="118" font-family="Consolas, monospace" font-size="10" fill="#1f2937">INS 500V</text>
  <text x="176" y="148" text-anchor="end" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#111827">1.82</text>
  <text x="176" y="159" text-anchor="end" font-family="Consolas, monospace" font-size="9" fill="#374151">GΩ</text>
  <!-- rotary -->
  <circle cx="230" cy="134" r="28" fill="#232b3b" stroke="#f59e0b" stroke-width="3"/>
  <rect x="226" y="110" width="8" height="24" rx="4" fill="#e5e7eb"/>
  <!-- terminals -->
  <g font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#e5e7eb">
    <circle cx="90" cy="218" r="13" fill="#16a34a"/><text x="90" y="250">E</text>
    <circle cx="140" cy="218" r="13" fill="#f59e0b"/><text x="140" y="250">P</text>
    <circle cx="190" cy="218" r="13" fill="#c0392b"/><text x="190" y="250">C</text>
  </g>
  <rect x="222" y="206" width="36" height="24" rx="6" fill="#f59e0b"/>
  <!-- leads to stakes -->
  <path d="M140 205 C 220 175, 300 150, 330 132" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <path d="M190 205 C 270 190, 360 150, 395 120" fill="none" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <!-- stakes -->
  <g>
    <rect x="318" y="118" width="24" height="7" rx="3" fill="#475569"/>
    <polygon points="326,125 334,125 332,268 328,268" fill="url(#steel)"/>
    <rect x="383" y="106" width="24" height="7" rx="3" fill="#475569"/>
    <polygon points="391,113 399,113 397,268 393,268" fill="url(#steel)"/>
  </g>
  <rect x="300" y="262" width="130" height="8" rx="4" fill="#a16207" opacity=".25"/>
</svg>
