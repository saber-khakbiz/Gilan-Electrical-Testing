  <g>
    <circle cx="332" cy="128" r="5" fill="#22c55e"/><circle cx="348" cy="128" r="5" fill="#22c55e"/><circle cx="364" cy="128" r="5" fill="#22c55e"/><circle cx="380" cy="128" r="5" fill="#22c55e"/>
