    <text x="66" y="156" fill="#cbd5e1">   03 00 01 00 0A 00 00 01</text>
    <text x="66" y="172" fill="#60a5fa">U  68 04 43 00 00 00</text>
    <text x="66" y="186" fill="#60a5fa">U  68 04 83 00 00 00</text>
