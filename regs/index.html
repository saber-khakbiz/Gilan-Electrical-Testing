    <style>
/* Regulation cards section of the main site.
   Same navy/amber palette as ../style.css and the self-hosted Vazirmatn font,
   so no external CDN or Google Fonts request is made (works on Iran's intranet). */
@font-face {
    font-family: "Vazirmatn";
    src: url("../fonts/Vazirmatn-Variable.woff2") format("woff2 supports variations"),
         url("../fonts/Vazirmatn-Variable.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
}

:root {
    --bg: #0a1128;
    --surface: #101f42;
    --surface-2: #0d1834;
    --line: #1c2d5a;
    --ink: #f8fafc;
    --muted: #9aa8c4;
    --accent: #f59e0b;
    --accent-glow: #fbbf24;
    --accent-ink: #0a1128;
    --ok: #6ee7b7;
    --warn: #fca5a5;
    --tip: #5eead4;
    --sat: 60%;
    --l-soft: 19%;
    --l-strong: 74%;
    --f-body: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
    --r: 10px;
    --maxw: 1152px;
    color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 16px;
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
}
body.no-scroll { overflow: hidden; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

.wrap {
    max-width: var(--maxw); margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- header (mirrors the main site header) ---------- */
.topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(10, 17, 40, .9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0px);
}
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.brand img { width: 44px; height: 44px; object-fit: contain; flex: none; }
.brand-txt { display: grid; min-width: 0; line-height: 1.5; }
.brand-name { font-weight: 800; font-size: 15px; }
.brand-sub { font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.tbtn {
    display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; font-weight: 700;
    text-decoration: none; color: var(--accent); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap;
}
.tbtn:hover { border-color: var(--accent); }
.tbtn svg { width: 18px; height: 18px; flex: none; }
.tbtn-back { color: var(--muted); }
.tbtn-back:hover { color: var(--ink); }
@media (max-width: 560px) { .tbtn-back .tbtn-label { display: none; } }
.readbar {
    position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--accent);
    transform: scaleX(0); transform-origin: right center; transition: transform .1s linear;
}

/* ---------- hero ---------- */
main.wrap { padding-block: 32px 64px; display: grid; gap: 28px; }
.hero { display: grid; gap: 14px; padding-block: 8px 4px; }
.plate {
    justify-self: start; direction: ltr; font-size: 12px; font-weight: 700; letter-spacing: .06em;
    font-variant-numeric: tabular-nums; color: var(--accent);
    border: 1px solid rgba(245, 158, 11, .4); border-radius: 4px; padding: 2px 10px;
}
.hero h1 { font-weight: 900; font-size: clamp(30px, 5.5vw, 52px); line-height: 1.35; letter-spacing: -.01em; }
.lead { color: var(--muted); max-width: 62ch; font-size: 17px; }
.hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; margin-top: 6px; }
.btn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 800;
    background: var(--accent); color: var(--accent-ink); padding: 10px 20px; border-radius: 8px;
    box-shadow: 0 10px 24px -10px rgba(245, 158, 11, .45);
}
.btn:hover { background: var(--accent-glow); }
.btn-done { background: transparent; color: var(--ok); border: 1px solid var(--ok); box-shadow: none; }
.meter-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 14px; color: var(--muted); }
.meter { display: flex; gap: 3px; }
.seg { width: 14px; height: 8px; border-radius: 2px; background: var(--line); }
.seg.is-on { background: hsl(var(--h) var(--sat) 58%); }
.linklike { font: inherit; font-size: 13px; color: var(--warn); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }

/* ---------- topic blocks ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.block {
    display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; min-width: 0;
    text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: 16px 18px 14px; transition: transform .15s ease, border-color .15s ease;
}
.block:hover { transform: translateY(-2px); border-color: var(--accent); }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.block-label { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
.block-num {
    font-weight: 900; font-size: 40px; line-height: 1.2; color: hsl(var(--h) var(--sat) var(--l-strong));
    background: hsl(var(--h) 45% var(--l-soft)); border-radius: 6px; padding: 4px 12px 0; min-width: 64px; text-align: center;
}
.block h2 { font-size: 18px; font-weight: 800; line-height: 1.6; }
.block p { color: var(--muted); font-size: 14px; line-height: 1.8; }
.block-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.block-meta { font-size: 13px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--ok); }
.ico { width: 14px; height: 14px; flex: none; }
.block.is-done .block-num { opacity: .7; }

.chip {
    display: inline-block; font-size: 12px; font-weight: 600; text-decoration: none; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; background: var(--surface-2); white-space: nowrap;
}
.chip:hover { color: var(--accent); border-color: var(--accent); }
.chip-lg { font-size: 14px; padding: 6px 16px; }
.tags-cta { display: flex; justify-content: center; }

/* ---------- topic page ---------- */
.series-layout { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .series-layout { grid-template-columns: 250px minmax(0, 1fr); } }
.side { display: none; }
@media (min-width: 1000px) {
    .side { display: grid; gap: 2px; align-content: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); }
}
.side-item {
    display: flex; align-items: center; gap: 10px; text-decoration: none; font-size: 14px; color: var(--muted);
    padding: 6px 10px; border-radius: 6px;
}
.side-item:hover { background: var(--surface); color: var(--ink); }
.side-item.is-active { background: hsl(var(--h) 45% var(--l-soft)); color: var(--ink); font-weight: 700; }
.side-item .ico { color: var(--ok); margin-inline-start: auto; }
.side-num { font-weight: 900; font-size: 16px; min-width: 30px; text-align: center; color: hsl(var(--h) var(--sat) var(--l-strong)); }
.side-t { line-height: 1.6; }
.side-tags { margin-top: 8px; border-top: 1px solid var(--line); border-radius: 0; padding-top: 12px; }

.series-main { display: grid; gap: 20px; min-width: 0; max-width: 760px; }
.series-head, .page-head { display: grid; gap: 8px; padding-bottom: 8px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--muted); text-decoration: none; }
.eyebrow-link:hover { color: var(--accent); }
.eyebrow-num { font-weight: 900; font-size: 20px; color: hsl(var(--h) var(--sat) var(--l-strong)); margin-inline-start: 4px; }
.series-head h1, .page-head h1 { font-weight: 900; font-size: clamp(26px, 4.2vw, 38px); line-height: 1.45; }
.series-head p, .page-head p { color: var(--muted); max-width: 62ch; }
.series-meta { font-size: 13px; color: var(--muted); }

.deck { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: 18px 20px 14px; display: grid; gap: 10px; min-width: 0;
}
.card-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.card-idx, .card-src { font-size: 12px; font-weight: 700; color: hsl(var(--h) var(--sat) var(--l-strong)); font-variant-numeric: tabular-nums; }
.card-src { text-decoration: none; background: hsl(var(--h) 45% var(--l-soft)); padding: 1px 10px; border-radius: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.card h3 { font-size: 19px; font-weight: 800; line-height: 1.6; }
.card-body { display: grid; gap: 10px; max-width: 65ch; color: #dbe3f1; }
.card-body strong { color: var(--ink); }
.card-body ul { margin: 0; padding-inline-start: 1.2em; display: grid; gap: 2px; }
.card-body li::marker { color: var(--accent); }
.note { border-radius: 6px; padding: 10px 14px; display: grid; gap: 2px; font-size: 15px; border: 1px solid transparent; }
.note-k { font-size: 12px; font-weight: 800; letter-spacing: .04em; }
.note-tip { background: rgba(94, 234, 212, .08); border-color: rgba(94, 234, 212, .18); }
.note-tip .note-k { color: var(--tip); }
.note-warn { background: rgba(248, 113, 113, .1); border-color: rgba(248, 113, 113, .22); }
.note-warn .note-k { color: var(--warn); }
.card-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 1px dashed var(--line); }
.copy, .react {
    font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 12px; cursor: pointer;
}
.copy:hover, .react:hover { color: var(--ink); border-color: var(--muted); }
.copy.is-flash { color: var(--ok); border-color: var(--ok); }
.reacts { display: flex; gap: 6px; }
.react { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; }
.react.is-on { border-color: var(--accent); background: rgba(245, 158, 11, .14); color: var(--ink); }
.react-n { font-variant-numeric: tabular-nums; font-size: 12px; }

.finish {
    display: flex; align-items: center; gap: 12px; cursor: pointer; font-weight: 800;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px;
}
.finish input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.finish:has(input:checked) { border-color: var(--ok); color: var(--ok); }

.pager { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; }
.pg {
    display: grid; text-decoration: none; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 8px 14px; font-weight: 700; font-size: 14px;
}
.pg:hover { border-color: var(--accent); }
.pg-k { font-size: 12px; font-weight: 500; color: var(--muted); }
.pg-next { text-align: left; }
.pg-home { display: flex; align-items: center; }

/* ---------- tags ---------- */
.tag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.tag-tile {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; text-decoration: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; font-weight: 700;
}
.tag-tile:hover { border-color: var(--accent); }
.tag-n { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
#app > .deck { max-width: 760px; }

/* ---------- drawer ---------- */
.drawer { position: fixed; inset: 0; z-index: 40; }
.drawer-shade { position: absolute; inset: 0; background: rgba(2, 6, 18, .6); border: 0; }
.drawer-panel {
    position: absolute; top: 0; bottom: 0; right: 0; width: min(320px, 86vw); background: var(--bg);
    border-left: 1px solid var(--line); overflow-y: auto; display: grid; align-content: start; gap: 6px;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) max(14px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) 14px;
}
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; border-bottom: 1px solid var(--line); font-weight: 800; }
.drawer-close { font: inherit; font-size: 22px; line-height: 1; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 8px; }
#drawerList { display: grid; gap: 2px; }
.drawer-back { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 12px; color: var(--accent); }

/* ---------- footer ---------- */
.foot { border-top: 1px solid var(--line); }
.foot .wrap { padding-block: 20px calc(28px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.foot p { max-width: 80ch; }

@media (max-width: 520px) {
    .block-num { font-size: 34px; min-width: 54px; }
    .card { padding: 16px 14px 12px; }
    .pager { grid-template-columns: 1fr 1fr; }
    .pg-home { grid-column: 1 / -1; grid-row: 2; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
    .block, .readbar { transition: none; }
}
    </style>
</head>
<body>
    <header class="topbar">
        <div class="wrap">
            <a class="brand" href="#">
                <img src="../images/logo.webp" alt="" width="44" height="44" onerror="this.hidden=true">
                <span class="brand-txt">
                    <span class="brand-name">صابر خاک‌بیز</span>
                    <span class="brand-sub" id="brandText"></span>
                </span>
            </a>
            <div class="top-actions">
                <a class="tbtn tbtn-back" href="../index.html" aria-label="بازگشت به سایت اصلی">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
                    <span class="tbtn-label" id="backText"></span>
                </a>
                <button type="button" class="tbtn" id="menuBtn" aria-expanded="false" aria-controls="drawer">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                    <span id="menuText"></span>
                </button>
            </div>
        </div>
        <span class="readbar" id="readbar"></span>
    </header>

    <main class="wrap" id="app"></main>

    <footer class="foot">
        <div class="wrap">
            <p id="disclaimer"></p>
            <p id="footnote"></p>
        </div>
    </footer>

    <div class="drawer" id="drawer" hidden>
        <button type="button" class="drawer-shade" data-close tabindex="-1" aria-hidden="true"></button>
        <nav class="drawer-panel">
            <div class="drawer-head"><span id="drawerTitle"></span><button type="button" class="drawer-close" data-close>&times;</button></div>
            <div id="drawerList"></div>
            <a class="side-item drawer-back" href="../index.html">صفحه‌ی اصلی سایت</a>
        </nav>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
